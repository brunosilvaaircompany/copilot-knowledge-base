  <script src="_shared/vendor/reveal.js/dist/reveal.js"></script>

  <script src="_shared/vendor/reveal.js/plugin/notes/notes.js"></script>
  <script>
    (function () {
      const deckId = new URLSearchParams(window.location.search).get("deck");
      try {
        const registry = JSON.parse(window.localStorage.getItem("deck-gallery:v1") || "{}");
        const deck = (registry.custom || []).find((item) => item.id === deckId);
        if (deck && deck.title) {
          document.title = deck.title;
          document.getElementById("local-deck-title").textContent = deck.title;
        }
      } catch (error) {
        console.warn("Não foi possível carregar os metadados do deck local.", error);
      }
    })();
    var prefersReduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    Reveal.initialize({
      hash: true,
      slideNumber: "c/t",
      progress: true,
      controls: true,
      center: false,
      transition: prefersReduced ? "none" : "fade",
      transitionSpeed: "fast",
      backgroundTransition: prefersReduced ? "none" : "fade",
      plugins: [RevealHighlight, RevealNotes]
    });
    SlideEditor.init(Reveal);
  </script>
