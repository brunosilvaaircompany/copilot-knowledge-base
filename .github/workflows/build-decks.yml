name: Verificar build dos decks

on:
  push:
    paths:
      - "decks/**/content.md"
      - "build.js"
      - "scripts/parse_content.js"
      - "scripts/render_slides.js"
      - "scripts/deck_content.py"
      - "_templates/base.html"
  pull_request:
    paths:
      - "decks/**/content.md"
      - "build.js"
      - "scripts/parse_content.js"
      - "scripts/render_slides.js"
      - "scripts/deck_content.py"
      - "_templates/base.html"

permissions:
  contents: read

jobs:
  verify-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Node
        run: npm install

      - name: Instalar dependências Python
        run: pip install pyyaml

      - name: Verificar que index.html não diverge de content.md
        run: |
          errors=0
          for content_md in decks/*/content.md; do
            deck_dir=$(dirname "$content_md")
            echo "Verificando: $deck_dir"
            node build.js --deck "$deck_dir" --check-only
            if [ $? -ne 0 ]; then
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ $errors deck(s) com index.html divergente."
            echo "   Execute 'node build.js --deck <deck-dir>' para regenerar."
            exit 1
          fi
          echo "✓ Todos os decks estão sincronizados."

      - name: Verificar que os parsers Python e JS enxergam os mesmos slides
        run: |
          errors=0
          for content_md in decks/*/content.md; do
            echo "Comparando parsers: $content_md"
            python3 scripts/deck_content.py --list "$content_md" > /tmp/py-ids.txt
            node -e '
              const fs = require("fs");
              const { parseContentMd } = require("./scripts/parse_content.js");
              const file = process.argv[1];
              const slides = parseContentMd(fs.readFileSync(file, "utf8"), file);
              process.stdout.write(slides.map(s => s.slide_id || "").join("\n") + "\n");
            ' "$content_md" > /tmp/js-ids.txt
            if ! diff -u /tmp/py-ids.txt /tmp/js-ids.txt; then
              echo "❌ Parsers divergem em $content_md"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ scripts/deck_content.py e scripts/parse_content.js divergem."
            echo "   Os dois precisam enxergar os mesmos slide_id na mesma ordem."
            exit 1
          fi
          echo "✓ Parsers Python e JS concordam sobre os slide_id."
