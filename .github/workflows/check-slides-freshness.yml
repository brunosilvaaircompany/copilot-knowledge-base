name: Verificar desatualização dos slides

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Atualizar documentação do GitHub"
      - "Atualizar documentação do VS Code"
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: freshness-check
      cancel-in-progress: false
    env:
      COPILOT_ASSIGNEE: ${{ secrets.COPILOT_ASSIGNEE }}
      # Camada 2 (semântica). Padrão `none`: sem a variável de repositório
      # SEMANTIC_PROVIDER configurada, a checagem se comporta exatamente como
      # a versão puramente determinística.
      #
      # Provedor escolhido quando ligado: `command`. GitHub Models foi
      # aposentado em 2026-07-30 (github-docs/content/github-models/index.md:3)
      # e o repositório é de conta pessoal, logo não há billing de organização
      # para `copilot-requests: write` — qualquer provedor exige secret novo.
      # `command` mantém a avaliação dentro do ecossistema já usado pelo repo
      # (Copilot CLI autenticado por PAT em SEMANTIC_API_KEY), sem acoplar o
      # script a um endpoint de terceiro. O provedor `http` continua disponível
      # como alternativa, bastando trocar SEMANTIC_PROVIDER para `http` e
      # definir SEMANTIC_ENDPOINT/SEMANTIC_MODEL.
      SEMANTIC_PROVIDER: ${{ vars.SEMANTIC_PROVIDER || 'none' }}
      SEMANTIC_COMMAND: ${{ vars.SEMANTIC_COMMAND }}
      SEMANTIC_ENDPOINT: ${{ vars.SEMANTIC_ENDPOINT }}
      SEMANTIC_MODEL: ${{ vars.SEMANTIC_MODEL }}
      SEMANTIC_MAX_CALLS: ${{ vars.SEMANTIC_MAX_CALLS || '20' }}
      SEMANTIC_API_KEY: ${{ secrets.SEMANTIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar desatualização dos slides por slide_id
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_slides_freshness.py \
            --manifest decks/.freshness-manifest.generated.yml \
            --state decks/.freshness-state.json \
            --report-json decks/.freshness-report.json \
            --summary-file decks/.freshness-summary.md \
            --write-state \
            --gh-repo "${{ github.repository }}" \
            --copilot-assignee "${COPILOT_ASSIGNEE}" \
            --semantic-provider "${SEMANTIC_PROVIDER}" \
            --semantic-command "${SEMANTIC_COMMAND}" \
            --semantic-endpoint "${SEMANTIC_ENDPOINT}" \
            --semantic-model "${SEMANTIC_MODEL}" \
            --semantic-api-key-env SEMANTIC_API_KEY \
            --semantic-max-calls "${SEMANTIC_MAX_CALLS}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f decks/.freshness-summary.md ]; then
            cat decks/.freshness-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit do estado atualizado
        if: steps.freshness.outputs.exit_code != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decks/.freshness-state.json
          git diff --cached --quiet || git commit -m "ci: atualiza freshness state [skip ci]"
          git push
