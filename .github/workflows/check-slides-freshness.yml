name: Verificar desatualização dos slides

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Atualizar documentação do GitHub"]
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: freshness-check
      cancel-in-progress: false
    env:
      COPILOT_ASSIGNEE: ${{ secrets.COPILOT_ASSIGNEE }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar desatualização dos slides por slide_id
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_slides_freshness.py \
            --manifest decks/.freshness-manifest.generated.yml \
            --state decks/.freshness-state.json \
            --report-json decks/.freshness-report.json \
            --summary-file decks/.freshness-summary.md \
            --write-state \
            --gh-repo "${{ github.repository }}" \
            --copilot-assignee "${COPILOT_ASSIGNEE}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f decks/.freshness-summary.md ]; then
            cat decks/.freshness-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit do estado atualizado
        if: steps.freshness.outputs.exit_code != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decks/.freshness-state.json
          git diff --cached --quiet || git commit -m "ci: atualiza freshness state [skip ci]"
          git push
