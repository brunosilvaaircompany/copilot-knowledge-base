name: Atualizar documentação do VS Code

on:
  schedule:
    - cron: "0 6 * * 3"  # toda quarta-feira às 06:00 UTC
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions

env:
  DOCS_SECTION: "docs/agents,docs/agent-customization,docs/chat"
  DOCS_OUTPUT: "./vscode-docs"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar e limpar documentação do VS Code
        run: python3 scripts/fetch_vscode_docs.py --section "$DOCS_SECTION" --output "$DOCS_OUTPUT"

      - name: Commit se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DOCS_OUTPUT"
          git diff --staged --quiet || git commit -m "docs: atualizar documentação do VS Code"
          git pull --rebase
          git push
